x-app: &app
  image: tp2-cluster-sync:local
  restart: "no"

x-cluster-environment: &cluster-environment
  NODE_PORT: 8000
  ZK_CONNECT: zookeeper:2181
  OBSERVER_HOST: observer
  OBSERVER_PORT: 7000
  EXPECTED_PARTICIPANTS: 5
  LOCK_ENABLED: ${LOCK_ENABLED:-true}
  BARRIER_ENABLED: ${BARRIER_ENABLED:-true}
  CONNECTION_TIMEOUT_SECONDS: 60
  REQUEST_TIMEOUT_SECONDS: 300
  LOCK_TIMEOUT_SECONDS: 180
  BARRIER_TIMEOUT_SECONDS: 180

x-client-environment: &client-environment
  CLUSTER_PORT: 8000
  REQUEST_COUNT: ${REQUEST_COUNT:-10}
  CLIENT_DELAY_MIN_MS: ${CLIENT_DELAY_MIN_MS:-1000}
  CLIENT_DELAY_MAX_MS: ${CLIENT_DELAY_MAX_MS:-5000}
  CRITICAL_SECTION_MIN_MS: ${CRITICAL_SECTION_MIN_MS:-200}
  CRITICAL_SECTION_MAX_MS: ${CRITICAL_SECTION_MAX_MS:-1000}
  STARTUP_TIMEOUT_SECONDS: 120
  REQUEST_TIMEOUT_SECONDS: 300

services:
  zookeeper:
    image: zookeeper:3.9.6-jre-17
    restart: "no"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 2s
      timeout: 3s
      retries: 30

  observer:
    <<: *app
    build:
      context: .
    command: br.ufop.bcc362.tp2.ObserverServer
    environment:
      OBSERVER_PORT: 7000
    ports:
      - "7000:7000"

  cluster-1:
    <<: *app
    command: br.ufop.bcc362.tp2.ClusterNode
    environment:
      <<: *cluster-environment
      NODE_ID: cluster-1
    ports:
      - "8001:8000"
    depends_on:
      zookeeper:
        condition: service_healthy
      observer:
        condition: service_started

  cluster-2:
    <<: *app
    command: br.ufop.bcc362.tp2.ClusterNode
    environment:
      <<: *cluster-environment
      NODE_ID: cluster-2
    ports:
      - "8002:8000"
    depends_on:
      zookeeper:
        condition: service_healthy
      observer:
        condition: service_started

  cluster-3:
    <<: *app
    command: br.ufop.bcc362.tp2.ClusterNode
    environment:
      <<: *cluster-environment
      NODE_ID: cluster-3
    ports:
      - "8003:8000"
    depends_on:
      zookeeper:
        condition: service_healthy
      observer:
        condition: service_started

  cluster-4:
    <<: *app
    command: br.ufop.bcc362.tp2.ClusterNode
    environment:
      <<: *cluster-environment
      NODE_ID: cluster-4
    ports:
      - "8004:8000"
    depends_on:
      zookeeper:
        condition: service_healthy
      observer:
        condition: service_started

  cluster-5:
    <<: *app
    command: br.ufop.bcc362.tp2.ClusterNode
    environment:
      <<: *cluster-environment
      NODE_ID: cluster-5
    ports:
      - "8005:8000"
    depends_on:
      zookeeper:
        condition: service_healthy
      observer:
        condition: service_started

  client-1:
    <<: *app
    command: br.ufop.bcc362.tp2.LoadClient
    environment:
      <<: *client-environment
      CLIENT_ID: client-1
      CLUSTER_HOST: cluster-1
      RANDOM_SEED: ${RANDOM_SEED_1:-101}
      CLIENT_DELAY_MIN_MS: ${CLIENT_1_DELAY_MIN_MS:-1000}
      CLIENT_DELAY_MAX_MS: ${CLIENT_1_DELAY_MAX_MS:-5000}
    depends_on:
      - cluster-1

  client-2:
    <<: *app
    command: br.ufop.bcc362.tp2.LoadClient
    environment:
      <<: *client-environment
      CLIENT_ID: client-2
      CLUSTER_HOST: cluster-2
      RANDOM_SEED: ${RANDOM_SEED_2:-202}
    depends_on:
      - cluster-2

  client-3:
    <<: *app
    command: br.ufop.bcc362.tp2.LoadClient
    environment:
      <<: *client-environment
      CLIENT_ID: client-3
      CLUSTER_HOST: cluster-3
      RANDOM_SEED: ${RANDOM_SEED_3:-303}
    depends_on:
      - cluster-3

  client-4:
    <<: *app
    command: br.ufop.bcc362.tp2.LoadClient
    environment:
      <<: *client-environment
      CLIENT_ID: client-4
      CLUSTER_HOST: cluster-4
      RANDOM_SEED: ${RANDOM_SEED_4:-404}
    depends_on:
      - cluster-4

  client-5:
    <<: *app
    command: br.ufop.bcc362.tp2.LoadClient
    environment:
      <<: *client-environment
      CLIENT_ID: client-5
      CLUSTER_HOST: cluster-5
      RANDOM_SEED: ${RANDOM_SEED_5:-505}
    depends_on:
      - cluster-5

