# O Compose inicia os contêineres; scripts/scenario.sh inicia a carga.
x-java: &java
  image: eclipse-temurin:17.0.17_10-jre-jammy
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  volumes:
    - .:/app
  init: true
  command: ["sleep", "infinity"]
  restart: "no"
  depends_on:
    zookeeper:
      condition: service_healthy

services:
  zookeeper:
    image: zookeeper:3.9.3
    ports:
      - "2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,ruok,stat,srvr"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  observer:
    <<: *java

  node-1:
    <<: *java

  node-2:
    <<: *java

  node-3:
    <<: *java

  node-4:
    <<: *java

  node-5:
    <<: *java

  client-1:
    <<: *java

  client-2:
    <<: *java

  client-3:
    <<: *java

  client-4:
    <<: *java

  client-5:
    <<: *java
